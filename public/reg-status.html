<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>DEPLOMAT · Registration Status</title>

    <!-- ═══ SUPABASE CLIENT ═══ -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>

    <style>
        /* ─── RESET & BASE ─────────────────────────────────────────── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            overscroll-behavior: none;
        }

        body {
            font-family: 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: #0a0a0f;
            color: #fff;
            overflow-x: hidden;
            min-height: 100dvh;
            -webkit-font-smoothing: antialiased;
        }

        /* ─── BACKGROUND ORBS ────────────────────────────────────────── */
        .page-bg-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.12;
            z-index: 0;
            pointer-events: none;
        }
        .orb-1 {
            width: 600px;
            height: 600px;
            background: #00d4ff;
            top: -15%;
            left: -15%;
        }
        .orb-2 {
            width: 500px;
            height: 500px;
            background: #b000ff;
            bottom: -15%;
            right: -15%;
        }
        .orb-3 {
            width: 400px;
            height: 400px;
            background: #ff2a6d;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0.05;
        }

        body::before {
            position: fixed;
            inset: 0;
            z-index: 0;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 46px 46px;
            content: "";
            mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.4), transparent 85%);
            pointer-events: none;
        }

        /* ─── HOME LINK ─────────────────────────────────────────────── */
        .home-link {
            position: fixed;
            top: 28px;
            left: 32px;
            z-index: 20;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            font-size: 0.75rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 500;
            padding: 10px 18px;
            border-radius: 60px;
            background: rgba(16, 16, 26, 0.5);
            backdrop-filter: blur(20px) saturate(1.2);
            -webkit-backdrop-filter: blur(20px) saturate(1.2);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
            transition: 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            -webkit-tap-highlight-color: transparent;
        }
        .home-link:hover {
            color: #00d4ff;
            border-color: rgba(0, 212, 255, 0.2);
            transform: translateX(-4px);
            background: rgba(0, 212, 255, 0.06);
        }
        .home-link:active {
            transform: scale(0.95);
        }

        /* ─── MAIN WRAPPER ──────────────────────────────────────────── */
        .status-wrap {
            position: relative;
            z-index: 2;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 100px 24px 60px 24px;
        }

        .status-container {
            width: min(100%, 900px);
            animation: reveal 0.65s ease both;
        }

        @keyframes reveal {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ─── STATUS CARD ───────────────────────────────────────────── */
        .status-card {
            position: relative;
            overflow: hidden;
            padding: clamp(32px, 5vw, 56px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            background: rgba(17, 24, 38, 0.75);
            box-shadow: 0 30px 90px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
        }

        .status-card::after {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #65d8ff, transparent);
            content: "";
            opacity: 0.8;
        }

        .status-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .status-header .eyebrow {
            color: #65d8ff;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .status-header h1 {
            font-family: 'Impact', 'Arial Black', sans-serif;
            font-size: clamp(1.8rem, 4.5vw, 3.2rem);
            font-weight: 900;
            letter-spacing: 0.06em;
            line-height: 1.1;
            background: linear-gradient(180deg, #ffffff 0%, #8a8a8a 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-header .sub {
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.75rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-top: 4px;
        }

        /* ─── SEARCH FORM ───────────────────────────────────────────── */
        .search-form {
            margin-bottom: 32px;
        }

        .search-form .form-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            margin-bottom: 16px;
        }

        .search-form .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .search-form .form-group label {
            font-size: 0.65rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.35);
            font-weight: 600;
        }

        .search-form .form-group input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
            font-size: 0.9rem;
            font-family: inherit;
            transition: 0.25s ease;
            outline: none;
        }

        .search-form .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.2);
        }

        .search-form .form-group input:focus {
            border-color: rgba(101, 216, 255, 0.3);
            background: rgba(101, 216, 255, 0.04);
            box-shadow: 0 0 0 4px rgba(101, 216, 255, 0.05);
        }

        .search-form .form-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 14px 36px;
            border: none;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            font-family: inherit;
            -webkit-tap-highlight-color: transparent;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-primary {
            background: linear-gradient(135deg, #65d8ff, #3b7bff);
            color: #0a0a0f;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(101, 216, 255, 0.2);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.04);
            color: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }

        /* ─── LOADING SPINNER ────────────────────────────────────────── */
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-top: 2px solid #65d8ff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .btn-loading {
            pointer-events: none;
            opacity: 0.7;
        }

        /* ─── HINT TEXT ──────────────────────────────────────────────── */
        .search-hint {
            text-align: center;
            color: rgba(255, 255, 255, 0.2);
            font-size: 0.7rem;
            letter-spacing: 0.1em;
            margin-top: 12px;
        }

        /* ─── RESULTS ────────────────────────────────────────────────── */
        .results-area {
            display: none;
            animation: fadeStep 0.5s ease both;
        }

        .results-area.show {
            display: block;
        }

        @keyframes fadeStep {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .results-header .count {
            font-size: 0.75rem;
            letter-spacing: 0.1em;
            color: rgba(255, 255, 255, 0.3);
        }

        .results-header .count strong {
            color: #65d8ff;
            font-weight: 700;
        }

        .results-grid {
            display: grid;
            gap: 16px;
        }

        /* ─── REGISTRATION RESULT CARD ──────────────────────────────── */
        .reg-result {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 20px 24px;
            transition: 0.3s ease;
        }

        .reg-result:hover {
            border-color: rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.03);
        }

        .reg-result .reg-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 12px;
        }

        .reg-result .reg-event {
            font-size: 1.1rem;
            font-weight: 700;
            color: #fff;
        }

        .reg-result .reg-event .sub {
            font-weight: 400;
            color: rgba(255, 255, 255, 0.35);
            font-size: 0.85rem;
            margin-left: 8px;
        }

        .reg-result .reg-badge {
            display: inline-block;
            padding: 4px 16px;
            border-radius: 40px;
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            background: rgba(76, 175, 80, 0.15);
            color: #4caf50;
            border: 1px solid rgba(76, 175, 80, 0.15);
        }

        .reg-result .reg-badge.pending {
            background: rgba(255, 197, 61, 0.12);
            color: #FFC53D;
            border-color: rgba(255, 197, 61, 0.15);
        }

        .reg-result .reg-body {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px 24px;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.55);
        }

        .reg-result .reg-body .reg-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .reg-result .reg-body .reg-item .label {
            font-size: 0.6rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.2);
            font-weight: 600;
        }

        .reg-result .reg-body .reg-item .value {
            color: rgba(255, 255, 255, 0.75);
            font-weight: 500;
        }

        .reg-result .reg-body .reg-item .value.leader {
            color: #65d8ff;
        }

        .reg-result .reg-body .reg-item .value.highlight {
            color: #FFC53D;
        }

        .reg-result .reg-footer {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .reg-result .reg-footer .participants {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.3);
        }

        .reg-result .reg-footer .participants strong {
            color: rgba(255, 255, 255, 0.6);
        }

        .reg-result .reg-footer .txn {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.2);
            font-family: 'Courier New', monospace;
            letter-spacing: 0.04em;
        }

        /* ─── NO RESULTS ─────────────────────────────────────────────── */
        .no-results {
            text-align: center;
            padding: 40px 20px;
        }

        .no-results .icon {
            font-size: 3rem;
            display: block;
            margin-bottom: 16px;
            opacity: 0.4;
        }

        .no-results h3 {
            font-size: 1.2rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 6px;
        }

        .no-results p {
            color: rgba(255, 255, 255, 0.2);
            font-size: 0.85rem;
        }

        .no-results .suggestions {
            margin-top: 16px;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.15);
            letter-spacing: 0.05em;
        }

        /* ─── RESPONSIVE ────────────────────────────────────────────── */
        @media (max-width: 992px) {
            .search-form .form-row {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }
        }

        @media (max-width: 768px) {
            .home-link {
                top: 18px;
                left: 18px;
                font-size: 0.7rem;
                padding: 8px 14px;
                letter-spacing: 2px;
            }

            .status-wrap {
                padding: 80px 16px 40px 16px;
            }

            .status-card {
                padding: clamp(24px, 4vw, 32px);
                border-radius: 20px;
            }

            .reg-result .reg-body {
                grid-template-columns: 1fr;
                gap: 6px;
            }

            .reg-result .reg-top {
                flex-direction: column;
                align-items: stretch;
            }

            .reg-result .reg-footer {
                flex-direction: column;
                align-items: flex-start;
            }

            .btn {
                padding: 12px 24px;
                font-size: 0.75rem;
                width: 100%;
            }

            .search-form .form-actions {
                flex-direction: column;
            }

            .status-header h1 {
                font-size: 1.8rem;
            }
        }

        @media (max-width: 480px) {
            .search-form .form-row {
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .status-card {
                padding: 20px 16px;
                border-radius: 16px;
            }

            .reg-result {
                padding: 16px;
            }

            .reg-result .reg-event {
                font-size: 0.95rem;
            }
            .reg-result .reg-event .sub {
                font-size: 0.75rem;
                display: block;
                margin-left: 0;
            }
        }

        /* ─── UTILITY ────────────────────────────────────────────────── */
        .text-center {
            text-align: center;
        }
        .mt-16 {
            margin-top: 16px;
        }
        .mb-8 {
            margin-bottom: 8px;
        }
        .hidden {
            display: none !important;
        }
        .text-aqua {
            color: #65d8ff;
        }
        .text-gold {
            color: #FFC53D;
        }
        .text-muted {
            color: rgba(255, 255, 255, 0.3);
        }
        .text-sm {
            font-size: 0.75rem;
        }

        /* ─── ERROR BANNER ───────────────────────────────────────────── */
        .error-banner {
            display: none;
            background: rgba(255, 42, 109, 0.12);
            border: 1px solid rgba(255, 42, 109, 0.2);
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 16px;
            align-items: center;
            gap: 12px;
            color: #ff6b8a;
            animation: fadeStep 0.35s ease both;
        }

        .error-banner.show {
            display: flex;
        }

        .error-banner .icon {
            font-size: 1.3rem;
            flex-shrink: 0;
        }

        .error-banner .msg {
            flex: 1;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <!-- ─── BACKGROUND ORBS ────────────────────────────────────────── -->
    <div class="page-bg-orb orb-1"></div>
    <div class="page-bg-orb orb-2"></div>
    <div class="page-bg-orb orb-3"></div>

    <!-- ─── HOME LINK ───────────────────────────────────────────────── -->
    <a href="index.html" class="home-link" aria-label="Back to home">← Home</a>

    <!-- ─── MAIN WRAPPER ───────────────────────────────────────────── -->
    <main class="status-wrap">
        <div class="status-container">

            <div class="status-card">

                <!-- ─── HEADER ─────────────────────────────────────────── -->
                <div class="status-header">
                    <p class="eyebrow">DEPLOMAT · 2026</p>
                    <h1>CHECK STATUS</h1>
                    <p class="sub">Verify your registration in the Atlantean Trials</p>
                </div>

                <!-- ─── ERROR BANNER ───────────────────────────────────── -->
                <div class="error-banner" id="errorBanner">
                    <span class="icon">⚠️</span>
                    <span class="msg" id="errorMsg">Something went wrong.</span>
                </div>

                <!-- ─── SEARCH FORM ────────────────────────────────────── -->
                <form class="search-form" id="searchForm" novalidate>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="searchName">Team Leader Name</label>
                            <input type="text" id="searchName" placeholder="e.g. John Doe" />
                        </div>
                        <div class="form-group">
                            <label for="searchEmail">Email</label>
                            <input type="email" id="searchEmail" placeholder="john@example.com" />
                        </div>
                        <div class="form-group">
                            <label for="searchPhone">Phone Number</label>
                            <input type="tel" id="searchPhone" placeholder="+91 98765 43210" />
                        </div>
                        <div class="form-group">
                            <label for="searchCollege">College Name</label>
                            <input type="text" id="searchCollege" placeholder="e.g. MIT, Stanford" />
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary" id="searchBtn">
                            🔍 Check Status
                        </button>
                        <button type="reset" class="btn btn-secondary" id="clearBtn">
                            Clear All
                        </button>
                    </div>

                    <p class="search-hint">
                        ✦ Enter at least one field above (Name, Email, Phone, or College)
                    </p>
                </form>

                <!-- ─── RESULTS AREA ───────────────────────────────────── -->
                <div class="results-area" id="resultsArea">

                    <div class="results-header">
                        <span class="count" id="resultCount">Found <strong>0</strong> registration(s)</span>
                        <button type="button" class="btn btn-secondary" style="padding:6px 18px;font-size:0.65rem;" id="clearResultsBtn">
                            ✕ Clear Results
                        </button>
                    </div>

                    <div class="results-grid" id="resultsGrid">
                        <!-- Dynamically populated -->
                    </div>
                </div>

                <!-- ─── REGISTER LINK ──────────────────────────────────── -->
                <div class="text-center mt-16">
                    <p style="color: rgba(255,255,255,0.15); font-size: 0.7rem; letter-spacing: 0.1em;">
                        Not registered yet?
                        <a href="registration.html" style="color: #65d8ff; text-decoration: none; font-weight: 600;">
                            Register now →
                        </a>
                    </p>
                </div>

            </div>

        </div>
    </main>


    <!-- ════════════════════════════════════════════════════════════════════
    JAVASCRIPT
    ════════════════════════════════════════════════════════════════════ -->
    <script>
        // ─── SUPABASE CONFIG ──────────────────────────────────────────

        const SUPABASE_URL = 'https://gfzeafvkkjbkqwmhzbhh.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdmemVhZnZra2pia3F3bWh6YmhoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwNzQ1NjIsImV4cCI6MjEwMjY1MDU2Mn0.wST073KahLxTB3bdn7wGiGn5P7Z1E1sZuBij4A7TCGM';

        let supabaseClient = null;

        try {
            if (typeof supabase !== 'undefined' && supabase.createClient) {
                supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                console.log('✅ Supabase client initialized.');
            } else if (typeof window.supabase !== 'undefined' && window.supabase.createClient) {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                console.log('✅ Supabase client initialized (window.supabase).');
            } else {
                console.warn('⚠️ Supabase library not loaded. Using localStorage fallback only.');
            }
        } catch (err) {
            console.error('❌ Failed to init Supabase:', err);
        }

        // ─── DOM REFS ──────────────────────────────────────────────────

        const form = document.getElementById('searchForm');
        const searchName = document.getElementById('searchName');
        const searchEmail = document.getElementById('searchEmail');
        const searchPhone = document.getElementById('searchPhone');
        const searchCollege = document.getElementById('searchCollege');
        const searchBtn = document.getElementById('searchBtn');
        const clearBtn = document.getElementById('clearBtn');
        const clearResultsBtn = document.getElementById('clearResultsBtn');
        const resultsArea = document.getElementById('resultsArea');
        const resultsGrid = document.getElementById('resultsGrid');
        const resultCount = document.getElementById('resultCount');
        const errorBanner = document.getElementById('errorBanner');
        const errorMsg = document.getElementById('errorMsg');

        // ─── UTILITY ──────────────────────────────────────────────────

        function showError(msg) {
            if (msg) {
                errorMsg.textContent = msg;
                errorBanner.classList.add('show');
            } else {
                errorBanner.classList.remove('show');
            }
        }

        function hideError() {
            errorBanner.classList.remove('show');
        }

        function setLoading(loading) {
            if (loading) {
                searchBtn.disabled = true;
                searchBtn.innerHTML = '<span class="spinner"></span> Searching...';
                searchBtn.classList.add('btn-loading');
            } else {
                searchBtn.disabled = false;
                searchBtn.innerHTML = '🔍 Check Status';
                searchBtn.classList.remove('btn-loading');
            }
        }

        function clearResults() {
            resultsArea.classList.remove('show');
            resultsGrid.innerHTML = '';
            resultCount.innerHTML = 'Found <strong>0</strong> registration(s)';
        }

        function getSearchParams() {
            return {
                name: searchName.value.trim(),
                email: searchEmail.value.trim(),
                phone: searchPhone.value.trim(),
                college: searchCollege.value.trim()
            };
        }

        function hasSearchTerms() {
            const p = getSearchParams();
            return !!(p.name || p.email || p.phone || p.college);
        }

        // ─── QUERY SUPABASE ───────────────────────────────────────────

        async function queryRegistrations(params) {
            // Try Supabase first
            if (supabaseClient) {
                try {
                    // Build OR filter dynamically
                    const filters = [];
                    if (params.name) {
                        filters.push(`team_leader.ilike.%${params.name}%`);
                    }
                    if (params.email) {
                        filters.push(`email.ilike.%${params.email}%`);
                    }
                    if (params.phone) {
                        // Phone might have spaces, dashes, etc. Search with partial match
                        const cleanPhone = params.phone.replace(/\s/g, '');
                        filters.push(`phone.ilike.%${cleanPhone}%`);
                        // Also try with spaces preserved
                        filters.push(`phone.ilike.%${params.phone}%`);
                    }
                    if (params.college) {
                        filters.push(`college.ilike.%${params.college}%`);
                    }

                    if (filters.length === 0) {
                        return { data: null, error: 'No search terms provided', source: 'supabase' };
                    }

                    // Use OR with all filters
                    const filterString = filters.join(',');

                    const { data, error } = await supabaseClient
                        .from('registrations')
                        .select('*')
                        .or(filterString)
                        .order('registered_at', { ascending: false });

                    if (error) {
                        console.warn('⚠️ Supabase query error:', error);
                        return { data: null, error: error.message, source: 'supabase' };
                    }

                    return { data: data || [], error: null, source: 'supabase' };

                } catch (err) {
                    console.warn('⚠️ Supabase query failed:', err);
                    return { data: null, error: err.message, source: 'supabase' };
                }
            }

            return { data: null, error: 'Supabase unavailable', source: 'supabase' };
        }

        // ─── QUERY LOCALSTORAGE (FALLBACK) ───────────────────────────

        function queryLocalStorage(params) {
            try {
                const db = JSON.parse(localStorage.getItem('deplomat_db') || '[]');
                if (!db.length) return [];

                const results = db.filter(entry => {
                    let match = false;
                    if (params.name) {
                        const nameLower = params.name.toLowerCase();
                        const entryName = (entry.teamLeader || '').toLowerCase();
                        if (entryName.includes(nameLower)) match = true;
                    }
                    if (params.email && !match) {
                        const emailLower = params.email.toLowerCase();
                        const entryEmail = (entry.email || '').toLowerCase();
                        if (entryEmail.includes(emailLower)) match = true;
                    }
                    if (params.phone && !match) {
                        const phoneClean = params.phone.replace(/\s/g, '');
                        const entryPhone = (entry.phone || '').replace(/\s/g, '');
                        if (entryPhone.includes(phoneClean)) match = true;
                    }
                    if (params.college && !match) {
                        const collegeLower = params.college.toLowerCase();
                        const entryCollege = (entry.college || '').toLowerCase();
                        if (entryCollege.includes(collegeLower)) match = true;
                    }
                    return match;
                });

                // Transform localStorage entries to match Supabase schema
                return results.map(entry => ({
                    event_name: entry.event || 'Unknown',
                    college: entry.college || '—',
                    ug_pu: entry.ug_pu || '—',
                    team_leader: entry.teamLeader || '—',
                    email: entry.email || '—',
                    phone: entry.phone || '—',
                    total_amount: entry.amount || 0,
                    txn: entry.txn || '—',
                    participants: (entry.participants || '').split(',').map(p => p.trim()).filter(Boolean),
                    registered_at: entry.registered_at || new Date().toISOString(),
                    _source: 'localStorage'
                }));

            } catch (err) {
                console.warn('⚠️ localStorage query failed:', err);
                return [];
            }
        }

        // ─── SEARCH ────────────────────────────────────────────────────

        async function performSearch() {
            const params = getSearchParams();

            if (!hasSearchTerms()) {
                showError('⚠️ Please enter at least one search term (Name, Email, Phone, or College).');
                clearResults();
                return;
            }

            hideError();
            setLoading(true);
            clearResults();

            try {
                // 1. Try Supabase
                let results = [];
                let usedSupabase = false;

                const supabaseResult = await queryRegistrations(params);
                if (supabaseResult.data && supabaseResult.data.length > 0) {
                    results = supabaseResult.data;
                    usedSupabase = true;
                } else if (supabaseResult.data && supabaseResult.data.length === 0) {
                    // No results from Supabase, try localStorage
                    const localResults = queryLocalStorage(params);
                    if (localResults.length > 0) {
                        results = localResults;
                    }
                } else {
                    // Supabase error or unavailable, fallback to localStorage
                    const localResults = queryLocalStorage(params);
                    if (localResults.length > 0) {
                        results = localResults;
                    }
                }

                // If still no results, try localStorage as a final fallback
                if (results.length === 0) {
                    const localResults = queryLocalStorage(params);
                    if (localResults.length > 0) {
                        results = localResults;
                    }
                }

                // ─── DISPLAY RESULTS ────────────────────────────────────
                if (results.length === 0) {
                    resultsGrid.innerHTML = `
                            <div class="no-results">
                                <span class="icon">🔍</span>
                                <h3>No Registrations Found</h3>
                                <p>We couldn't find any registration matching your search.</p>
                                <p class="suggestions">💡 Try double‑checking the spelling or use a different search term.</p>
                            </div>
                        `;
                    resultCount.innerHTML = 'Found <strong>0</strong> registration(s)';
                    resultsArea.classList.add('show');
                    return;
                }

                // Display results
                resultCount.innerHTML = `Found <strong>${results.length}</strong> registration(s)`;

                let html = '';
                results.forEach((reg, idx) => {
                    const isLocal = reg._source === 'localStorage';
                    const eventName = reg.event_name || 'Unknown Event';
                    const eventSub = reg.event_sub || '';
                    const college = reg.college || '—';
                    const ugPu = reg.ug_pu || '—';
                    const leader = reg.team_leader || '—';
                    const email = reg.email || '—';
                    const phone = reg.phone || '—';
                    const amount = reg.total_amount || 0;
                    const txn = reg.txn || '—';
                    const date = reg.registered_at ? new Date(reg.registered_at).toLocaleString() : '—';

                    // Participants
                    let participantsList = [];
                    if (reg.participants && Array.isArray(reg.participants)) {
                        participantsList = reg.participants.map(p => {
                            if (typeof p === 'string') return p;
                            if (p.name) return p.name;
                            return JSON.stringify(p);
                        });
                    } else if (typeof reg.participants === 'string') {
                        participantsList = reg.participants.split(',').map(p => p.trim()).filter(Boolean);
                    } else if (reg.participants && typeof reg.participants === 'object') {
                        try {
                            participantsList = Object.values(reg.participants).map(v => v.name || v).filter(Boolean);
                        } catch (e) {
                            participantsList = [];
                        }
                    }

                    // If no participants, try to get from localStorage format
                    if (participantsList.length === 0 && isLocal) {
                        const parts = (reg.participants || '').split(',').map(p => p.trim()).filter(Boolean);
                        if (parts.length > 0) participantsList = parts;
                    }

                    const participantCount = participantsList.length || 1;
                    const displayParticipants = participantsList.slice(0, 5);
                    const moreCount = participantCount - displayParticipants.length;

                    html += `
                            <div class="reg-result">
                                <div class="reg-top">
                                    <div>
                                        <span class="reg-event">
                                            ${eventName}
                                            ${eventSub ? `<span class="sub">· ${eventSub}</span>` : ''}
                                        </span>
                                        ${isLocal ? '<span style="font-size:0.55rem;color:rgba(255,255,255,0.15);margin-left:8px;">(local backup)</span>' : ''}
                                    </div>
                                    <span class="reg-badge">✅ Confirmed</span>
                                </div>

                                <div class="reg-body">
                                    <div class="reg-item">
                                        <span class="label">College</span>
                                        <span class="value">${college}</span>
                                    </div>
                                    <div class="reg-item">
                                        <span class="label">Category</span>
                                        <span class="value">${ugPu}</span>
                                    </div>
                                    <div class="reg-item">
                                        <span class="label">Team Leader</span>
                                        <span class="value leader">${leader}</span>
                                    </div>
                                    <div class="reg-item">
                                        <span class="label">Email</span>
                                        <span class="value">${email}</span>
                                    </div>
                                    <div class="reg-item">
                                        <span class="label">Phone</span>
                                        <span class="value">${phone}</span>
                                    </div>
                                    <div class="reg-item">
                                        <span class="label">Total Paid</span>
                                        <span class="value highlight">₹${amount}</span>
                                    </div>
                                    <div class="reg-item" style="grid-column: 1 / -1;">
                                        <span class="label">Registered On</span>
                                        <span class="value" style="font-size:0.8rem;color:rgba(255,255,255,0.4);">${date}</span>
                                    </div>
                                </div>

                                <div class="reg-footer">
                                    <span class="participants">
                                        👥 <strong>${participantCount}</strong> participant${participantCount > 1 ? 's' : ''}
                                        ${displayParticipants.length > 0 ? `· ${displayParticipants.join(', ')}` : ''}
                                        ${moreCount > 0 ? ` <span style="color:rgba(255,255,255,0.2);">+${moreCount} more</span>` : ''}
                                    </span>
                                    <span class="txn">📋 UTR: ${txn}</span>
                                </div>
                            </div>
                        `;
                });

                resultsGrid.innerHTML = html;
                resultsArea.classList.add('show');

                // Scroll to results
                resultsArea.scrollIntoView({ behavior: 'smooth', block: 'start' });

            } catch (err) {
                console.error('❌ Search error:', err);
                showError('❌ An error occurred while searching. Please try again.');
            } finally {
                setLoading(false);
            }
        }

        // ─── EVENT LISTENERS ──────────────────────────────────────────

        // Search form submit
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            performSearch();
        });

        // Clear button (clears form fields + results)
        clearBtn.addEventListener('click', () => {
            searchName.value = '';
            searchEmail.value = '';
            searchPhone.value = '';
            searchCollege.value = '';
            hideError();
            clearResults();
        });

        // Clear results button
        clearResultsBtn.addEventListener('click', () => {
            clearResults();
            hideError();
        });

        // Enter key on any field triggers search
        [searchName, searchEmail, searchPhone, searchCollege].forEach(input => {
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    performSearch();
                }
            });
        });

        // ─── AUTO-SEARCH FROM URL PARAMS ──────────────────────────────

        function autoSearchFromURL() {
            try {
                const params = new URLSearchParams(window.location.search);
                const name = params.get('name');
                const email = params.get('email');
                const phone = params.get('phone');
                const college = params.get('college');

                let hasAuto = false;
                if (name) { searchName.value = name;
                    hasAuto = true; }
                if (email) { searchEmail.value = email;
                    hasAuto = true; }
                if (phone) { searchPhone.value = phone;
                    hasAuto = true; }
                if (college) { searchCollege.value = college;
                    hasAuto = true; }

                if (hasAuto) {
                    setTimeout(() => {
                        performSearch();
                    }, 400);
                }
            } catch (e) {
                console.warn('⚠️ Auto-search from URL failed:', e);
            }
        }

        // ─── INIT ──────────────────────────────────────────────────────

        console.log('🔍 DEPLOMAT Registration Status ready!');
        console.log('🔐 Supabase available:', !!supabaseClient);
        console.log('💾 localStorage fallback: enabled');

        // Auto-search if URL params present
        autoSearchFromURL();

        // ─── EXPOSE FOR CONSOLE DEBUG ─────────────────────────────────

        window.__status = {
            search: performSearch,
            querySupabase: queryRegistrations,
            queryLocal: queryLocalStorage,
            clear: clearResults,
            supabase: supabaseClient
        };
    </script>

</body>
</html>
