<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Explore Campus · VR Tour</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Google VR iframe */
        #vr-frame {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            border: none;
            z-index: 1;
        }

        /* Overlay – black gradient + title */
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 10;
            cursor: pointer;
            background: radial-gradient(ellipse at 50% 80%,
                        transparent 30%,
                        rgba(0, 0, 0, 0.3) 55%,
                        rgba(0, 0, 0, 0.7) 85%,
                        rgba(0, 0, 0, 0.9) 100%);
            transition: opacity 0.8s ease, transform 0.8s ease;
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            padding: 28px;
        }
        #overlay.hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(1.05);
        }

        /* Title – top‑left */
        #title {
            color: #fff;
            font-size: clamp(1.8rem, 5vw, 3.5rem);
            font-weight: 700;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.8), 0 0 40px rgba(0, 0, 0, 0.5);
            transition: opacity 0.6s ease 0.2s, transform 0.6s ease 0.2s;
            user-select: none;
        }
        #title .sub {
            display: block;
            font-size: 0.4em;
            font-weight: 300;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            opacity: 0.7;
            margin-top: 4px;
        }
        #overlay.hidden #title {
            opacity: 0;
            transform: translateY(-12px);
        }

        /* Hint at bottom */
        #hint {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.85rem;
            font-weight: 300;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8);
            z-index: 11;
            animation: pulseHint 2.4s ease-in-out infinite;
            transition: opacity 0.6s ease;
            pointer-events: none;
        }
        #overlay.hidden ~ #hint {
            opacity: 0;
            animation: none;
        }

        @keyframes pulseHint {
            0%, 100% { opacity: 0.4; transform: translateX(-50%) scale(1); }
            50% { opacity: 0.9; transform: translateX(-50%) scale(1.05); }
        }

        @media (max-width: 640px) {
            #overlay { padding: 20px; }
            #title { font-size: clamp(1.2rem, 6vw, 2rem); }
            #hint { font-size: 0.7rem; bottom: 28px; }
        }
    </style>
</head>
<body>

    <iframe id="vr-frame"
        src="https://share.google/VW9zZQhOLe5Qg6l3J"
        allow="vr; gyroscope; accelerometer; fullscreen"
        allowfullscreen>
    </iframe>

    <div id="overlay" role="button" aria-label="Tap to explore campus">
        <div id="title">
            Explore Campus
            <span class="sub">Virtual Tour</span>
        </div>
    </div>

    <div id="hint">⟳ Tap anywhere to begin</div>

    <script>
        const overlay = document.getElementById('overlay');

        function dismissOverlay() {
            if (overlay.classList.contains('hidden')) return;
            overlay.classList.add('hidden');
        }

        overlay.addEventListener('click', dismissOverlay);
        overlay.addEventListener('touchstart', dismissOverlay, { passive: true });
        overlay.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                dismissOverlay();
            }
        });
    </script>

</body>
</html>
