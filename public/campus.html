<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Explore Campus · VR Tour</title>

    <!-- ⚡ PRELOAD OPTIMIZATIONS ⚡ -->
    <link rel="dns-prefetch" href="https://share.google" />
    <link rel="dns-prefetch" href="https://www.google.com" />
    <link rel="dns-prefetch" href="https://storage.googleapis.com" />
    <link rel="preconnect" href="https://share.google" crossorigin />
    <link rel="preconnect" href="https://www.google.com" crossorigin />
    <link rel="preconnect" href="https://storage.googleapis.com" crossorigin />
    <link rel="preload" as="document" href="https://share.google/VW9zZQhOLe5Qg6l3J" />

    <!-- Google Fonts: Cinzel + Cormorant Garamond -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --abyss: #041217;
            --teal-dark: #08252B;
            --teal-mid: #0B3A40;
            --gold: #A98445;
            --gold-light: #C09A52;
            --gold-bright: #D0AF69;
            --cream: #F4EBDD;
            --text-muted: rgba(232, 217, 184, 0.7);
        }

        body,
        html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--abyss);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* ─── VR IFRAME ─── */
        #vr-frame {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            border: none;
            z-index: 1;
            loading: eager;
            opacity: 1;
        }

        /* ─── OVERLAY ─── */
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 10;
            cursor: pointer;
            background: radial-gradient(ellipse at 50% 75%,
                    transparent 25%,
                    rgba(4, 18, 23, 0.4) 50%,
                    rgba(4, 18, 23, 0.8) 80%,
                    var(--abyss) 100%);
            transition: opacity 0.9s ease, transform 0.9s ease;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: flex-start;
            padding: 30px 36px;
        }
        #overlay.hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(1.04);
        }

        /* ─── LOGO (top-left) ─── */
        .logo-icon {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: 1.5px solid rgba(169, 132, 69, 0.25);
            background: rgba(4, 18, 23, 0.7);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
            margin-bottom: 18px;
            cursor: pointer;
            flex-shrink: 0;
        }
        .logo-icon:hover {
            border-color: var(--gold);
            transform: scale(1.06);
            box-shadow: 0 0 30px rgba(169, 132, 69, 0.25);
        }
        .logo-icon svg {
            width: 30px;
            height: 30px;
        }

        /* ─── TITLE ─── */
        #title {
            color: var(--cream);
            font-family: 'Cinzel', serif;
            font-size: clamp(2rem, 5.5vw, 3.8rem);
            font-weight: 700;
            letter-spacing: 0.04em;
            text-shadow: 0 2px 30px rgba(0, 0, 0, 0.9), 0 0 60px rgba(0, 0, 0, 0.5);
            transition: opacity 0.6s ease 0.2s, transform 0.6s ease 0.2s;
            user-select: none;
            line-height: 1.1;
        }
        #title .sub {
            display: block;
            font-family: 'Cormorant Garamond', serif;
            font-size: 0.35em;
            font-weight: 400;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            color: var(--gold-light);
            margin-top: 6px;
            opacity: 0.85;
            font-style: italic;
        }
        #overlay.hidden #title {
            opacity: 0;
            transform: translateY(-14px);
        }

        /* ─── HINT (bottom-center) ─── */
        #hint {
            position: fixed;
            bottom: 44px;
            left: 50%;
            transform: translateX(-50%);
            color: var(--text-muted);
            font-family: 'Cormorant Garamond', serif;
            font-size: 0.9rem;
            font-weight: 300;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            text-shadow: 0 2px 16px rgba(0, 0, 0, 0.9);
            z-index: 11;
            animation: pulseHint 2.8s ease-in-out infinite;
            transition: opacity 0.6s ease;
            pointer-events: none;
        }
        #overlay.hidden~#hint {
            opacity: 0;
            animation: none;
        }

        @keyframes pulseHint {
            0%,
            100% {
                opacity: 0.35;
                transform: translateX(-50%) scale(1);
            }
            50% {
                opacity: 0.85;
                transform: translateX(-50%) scale(1.04);
            }
        }

        /* ─── SOCIAL SIDEBAR ─── */
        .social-sidebar {
            position: fixed;
            right: 24px;
            bottom: 120px;
            z-index: 12;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: opacity 0.6s ease 0.4s;
        }
        #overlay.hidden~.social-sidebar {
            opacity: 1;
        }
        .social-sidebar:not(:has(~#overlay.hidden)) {
            opacity: 0.3;
        }

        .social-icon {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(4, 18, 23, 0.7);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(169, 132, 69, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.3s;
            color: var(--text-muted);
            font-size: 1.05rem;
            font-weight: 600;
            font-family: 'Cinzel', serif;
            text-decoration: none;
            user-select: none;
        }
        .social-icon:hover {
            border-color: var(--gold);
            color: var(--gold-bright);
            transform: translateX(-4px);
            box-shadow: 0 0 20px rgba(169, 132, 69, 0.15);
        }

        /* ─── AUDIO MODAL ─── */
        .audio-modal {
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(4, 18, 23, 0.82);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: 0.4s;
        }
        .audio-modal.show {
            opacity: 1;
            visibility: visible;
        }

        .audio-content {
            background: rgba(6, 26, 32, 0.96);
            border: 1px solid rgba(169, 132, 69, 0.18);
            border-radius: 18px;
            padding: 44px 52px;
            text-align: center;
            box-shadow: 0 24px 72px rgba(0, 0, 0, 0.9);
            max-width: 400px;
            width: 90%;
        }
        .audio-title {
            font-family: 'Cinzel', serif;
            font-size: 1.2rem;
            color: var(--cream);
            margin-bottom: 28px;
            letter-spacing: 0.1em;
            font-weight: 600;
        }
        .audio-buttons {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .audio-btn {
            padding: 12px 36px;
            border-radius: 8px;
            border: 1px solid rgba(169, 132, 69, 0.2);
            background: rgba(4, 18, 23, 0.6);
            font-family: 'Cinzel', serif;
            font-size: 0.7rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--text-muted);
            cursor: pointer;
            transition: 0.3s;
        }
        .audio-btn:hover {
            border-color: var(--gold);
            background: rgba(169, 132, 69, 0.1);
            color: var(--gold-bright);
        }
        .audio-btn.primary {
            background: rgba(169, 132, 69, 0.12);
            border-color: rgba(169, 132, 69, 0.25);
            color: var(--gold-light);
        }
        .audio-btn.primary:hover {
            background: rgba(169, 132, 69, 0.2);
            border-color: var(--gold);
            color: var(--gold-bright);
        }

        /* ─── TOAST ─── */
        #toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(24px);
            background: rgba(6, 26, 32, 0.95);
            padding: 14px 32px;
            border-radius: 12px;
            border: 1px solid rgba(169, 132, 69, 0.2);
            color: var(--gold-bright);
            font-family: 'Cormorant Garamond', serif;
            font-size: 0.95rem;
            letter-spacing: 0.06em;
            opacity: 0;
            pointer-events: none;
            transition: 0.45s cubic-bezier(0.22, 1, 0.36, 1);
            z-index: 2000;
            backdrop-filter: blur(8px);
            white-space: nowrap;
        }
        #toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ─── RESPONSIVE ─── */
        @media (max-width: 640px) {
            #overlay {
                padding: 22px 24px;
            }
            #title {
                font-size: clamp(1.3rem, 6.5vw, 2rem);
            }
            #title .sub {
                font-size: 0.3em;
                letter-spacing: 0.2em;
            }
            .logo-icon {
                width: 42px;
                height: 42px;
                margin-bottom: 12px;
            }
            .logo-icon svg {
                width: 24px;
                height: 24px;
            }
            #hint {
                font-size: 0.7rem;
                bottom: 28px;
                letter-spacing: 0.15em;
            }
            .social-sidebar {
                right: 14px;
                bottom: 90px;
                gap: 10px;
            }
            .social-icon {
                width: 36px;
                height: 36px;
                font-size: 0.85rem;
            }
            .audio-content {
                padding: 32px 24px;
            }
            .audio-title {
                font-size: 1rem;
            }
            .audio-btn {
                padding: 10px 24px;
                font-size: 0.6rem;
            }
            #toast {
                font-size: 0.8rem;
                padding: 10px 20px;
                bottom: 80px;
                white-space: normal;
                max-width: 85vw;
            }
        }

        @media (max-width: 420px) {
            #overlay {
                padding: 16px 18px;
            }
            #title {
                font-size: clamp(1rem, 7vw, 1.5rem);
            }
            .logo-icon {
                width: 36px;
                height: 36px;
                margin-bottom: 8px;
            }
            .logo-icon svg {
                width: 20px;
                height: 20px;
            }
            #hint {
                font-size: 0.6rem;
                bottom: 20px;
            }
            .social-sidebar {
                right: 10px;
                bottom: 72px;
                gap: 8px;
            }
            .social-icon {
                width: 32px;
                height: 32px;
                font-size: 0.7rem;
            }
        }
    </style>
</head>
<body>

    <!-- ─── VR IFRAME ─── -->
    <iframe id="vr-frame"
    src="https://share.google/VW9zZQhOLe5Qg6l3J"
    allow="vr; gyroscope; accelerometer; fullscreen"
    allowfullscreen
    loading="eager">
</iframe>

<!-- ─── OVERLAY ─── -->
<div id="overlay" role="button" aria-label="Tap to explore campus">

    <!-- Logo -->
    <div class="logo-icon" onclick="window.location.reload();" aria-label="Reload tour">
        <svg viewBox="0 0 48 48" fill="none">
            <circle cx="24" cy="24" r="20" stroke="rgba(169,132,69,0.5)" stroke-width="1.5" />
            <path d="M24 12 L24 36 M18 20 L24 28 L30 20" stroke="rgba(169,132,69,0.7)" stroke-width="1.5" stroke-linecap="round" />
            <circle cx="24" cy="24" r="3" fill="rgba(169,132,69,0.3)" />
        </svg>
    </div>

    <!-- Title -->
    <div id="title">
        Explore Campus
        <span class="sub">Virtual Tour</span>
    </div>
</div>

<!-- ─── HINT ─── -->
<div id="hint">↻ Tap anywhere to begin</div>

<!-- ─── SOCIAL SIDEBAR ─── -->
<div class="social-sidebar">
    <div class="social-icon" onclick="showToast('WhatsApp')" aria-label="WhatsApp">⌘</div>
    <div class="social-icon" onclick="showToast('Facebook')" aria-label="Facebook">f</div>
    <div class="social-icon" onclick="showToast('Twitter')" aria-label="Twitter">𝕏</div>
    <div class="social-icon" onclick="showToast('LinkedIn')" aria-label="LinkedIn">in</div>
</div>

<!-- ─── AUDIO MODAL ─── -->
<div class="audio-modal show" id="audioModal">
    <div class="audio-content">
        <div class="audio-title">Enable audio?</div>
        <div class="audio-buttons">
            <button class="audio-btn" onclick="closeAudioModal(true)">YES</button>
            <button class="audio-btn primary" onclick="closeAudioModal(false)">NO</button>
        </div>
    </div>
</div>

<!-- ─── TOAST ─── -->
<div id="toast"></div>

<!-- ─── SCRIPTS ─── -->
<script>
    // ── Overlay ──
    const overlay = document.getElementById('overlay');

    function dismissOverlay() {
        if (overlay.classList.contains('hidden')) return;
        overlay.classList.add('hidden');
        // Auto-hide modal if still visible after overlay dismiss
        setTimeout(() => {
            const modal = document.getElementById('audioModal');
            if (modal && modal.classList.contains('show')) {
                // Keep it visible — user can decide
            }
        }, 400);
    }

    overlay.addEventListener('click', dismissOverlay);
    overlay.addEventListener('touchstart', dismissOverlay, { passive: true });
    overlay.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            dismissOverlay();
        }
    });

    // ── Audio Modal ──
    let audioEnabled = false;

    function closeAudioModal(enable) {
        audioEnabled = enable;
        document.getElementById('audioModal').classList.remove('show');
        if (enable) {
            showToast('🔊 Audio enabled');
        } else {
            showToast('🔇 Audio disabled');
        }
    }

    // ── Toast ──
    let toastTimeout;

    function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.classList.add('show');
        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => {
            toast.classList.remove('show');
        }, 3000);
    }

    // ── Keyboard shortcut: Escape to dismiss overlay ──
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && !overlay.classList.contains('hidden')) {
            dismissOverlay();
        }
    });

    // ── If the iframe loads, the overlay can be dismissed ──
    // (user still needs to tap, but we keep it as a graceful fallback)
    console.log('🌿 Explore Campus VR Tour · UI enhanced with dark-green aesthetic');
</script>

</body>
</html>
