<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>DEPLOMAT · Legacy</title>

    <style>
        /* ----- reset & base ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            overscroll-behavior: none;
        }

        body {
            font-family: 'Cinzel', 'Segoe UI', 'Helvetica Neue', system-ui, -apple-system, sans-serif;
            background: #041217;
            color: #fff;
            overflow-x: hidden;
            min-height: 100dvh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ----- background orbs (refined) ----- */
        .page-bg-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(130px);
            opacity: 0.13;
            z-index: 0;
            pointer-events: none;
            will-change: transform;
        }

        .orb-a {
            width: 600px;
            height: 600px;
            background: #0787A2;
            top: -10%;
            left: -10%;
        }

        .orb-b {
            width: 500px;
            height: 500px;
            background: #A98445;
            bottom: -15%;
            right: -8%;
            opacity: 0.10;
        }

        .orb-c {
            width: 400px;
            height: 400px;
            background: #19D5F2;
            top: 45%;
            left: 60%;
            opacity: 0.04;
            filter: blur(150px);
        }

        /* ----- home link (cinematic) ----- */
        .home-link {
            position: fixed;
            top: 28px;
            left: 32px;
            z-index: 30;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: rgba(232, 217, 184, 0.6);
            text-decoration: none;
            font-size: 0.7rem;
            letter-spacing: 3.5px;
            text-transform: uppercase;
            font-weight: 500;
            padding: 10px 22px;
            border-radius: 60px;
            background: rgba(4, 18, 23, 0.6);
            backdrop-filter: blur(18px) saturate(1.3);
            -webkit-backdrop-filter: blur(18px) saturate(1.3);
            border: 1px solid rgba(169, 132, 69, 0.12);
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.7);
            transition: 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            -webkit-tap-highlight-color: transparent;
        }

        .home-link:hover {
            color: #C09A52;
            border-color: rgba(169, 132, 69, 0.3);
            transform: translateX(-5px) scale(1.02);
            background: rgba(169, 132, 69, 0.08);
            box-shadow: 0 12px 40px rgba(169, 132, 69, 0.08);
        }

        .home-link:active {
            transform: scale(0.94);
        }

        .home-link .arrow {
            display: inline-block;
            transition: transform 0.2s ease;
        }

        .home-link:hover .arrow {
            transform: translateX(-4px);
        }

        /* ----- main layout ----- */
        .page-wrap {
            position: relative;
            z-index: 2;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 120px 28px 90px 28px;
            max-width: 1360px;
            margin: 0 auto;
        }

        /* ----- header section ----- */
        .header-section {
            width: 100%;
            text-align: center;
            margin-bottom: 40px;
            animation: fadeDown 0.9s cubic-bezier(0.23, 1, 0.32, 1) both;
        }

        .page-title {
            font-family: 'Cinzel', serif;
            font-size: clamp(3rem, 10vw, 6rem);
            font-weight: 900;
            letter-spacing: 12px;
            text-transform: uppercase;
            line-height: 1.1;
            background: linear-gradient(180deg, #FFF8E7 0%, #E6C875 25%, #C09A52 50%, #8B6B3A 75%, #5C4020 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 4px 16px rgba(169, 132, 69, 0.15));
            margin-bottom: 4px;
        }

        .page-sub {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(0.8rem, 1.5vw, 1.2rem);
            letter-spacing: 6px;
            text-transform: uppercase;
            color: rgba(169, 132, 69, 0.4);
            font-weight: 300;
            margin-top: 4px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            display: inline-block;
        }

        .page-divider {
            width: min(260px, 70vw);
            height: 1px;
            margin: 20px auto 24px auto;
            background: linear-gradient(90deg, transparent, rgba(169, 132, 69, 0.3), rgba(169, 132, 69, 0.5), rgba(169, 132, 69, 0.3), transparent);
            border: none;
        }

        /* ----- card grid ----- */
        .cards-grid {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 36px;
            animation: fadeUp 1s cubic-bezier(0.23, 1, 0.32, 1) both;
            animation-delay: 0.15s;
        }

        /* featured card (card 1) */
        .card-featured {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card-grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 32px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        /* ----- card base ----- */
        .card-link {
            display: block;
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            text-decoration: none;
            color: var(--primary-text);
            background: #061A20;
            border: 1px solid rgba(169, 132, 69, 0.06);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1),
                box-shadow 0.4s ease, border-color 0.3s ease;
            will-change: transform;
            aspect-ratio: 16 / 9;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .card-link:hover {
            transform: scale(1.025);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 30px rgba(169, 132, 69, 0.04);
            border-color: rgba(169, 132, 69, 0.15);
            z-index: 10;
        }

        .card-link:active {
            transform: scale(0.98);
        }

        /* card image wrapper */
        .card-image-wrap {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .card-image-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            will-change: transform;
        }

        .card-link:hover .card-image-wrap img {
            transform: scale(1.04);
        }

        /* ----- gradient overlay (cinematic) ----- */
        .card-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg,
                    rgba(0, 0, 0, 0.05) 0%,
                    rgba(0, 0, 0, 0.25) 40%,
                    rgba(0, 0, 0, 0.7) 75%,
                    rgba(0, 0, 0, 0.9) 100%);
            pointer-events: none;
            transition: background 0.4s ease;
        }

        .card-link:hover .card-overlay {
            background: linear-gradient(180deg,
                    rgba(0, 0, 0, 0.02) 0%,
                    rgba(0, 0, 0, 0.20) 35%,
                    rgba(0, 0, 0, 0.75) 75%,
                    rgba(0, 0, 0, 0.95) 100%);
        }

        /* edge glow (subtle) */
        .card-link::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 20px;
            pointer-events: none;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.02);
            transition: box-shadow 0.4s ease;
        }

        .card-link:hover::after {
            box-shadow: inset 0 0 0 1px rgba(169, 132, 69, 0.12), 0 0 30px rgba(169, 132, 69, 0.02);
        }

        /* ----- card content (bottom) ----- */
        .card-content {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 24px 28px 22px 28px;
            z-index: 2;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            pointer-events: none;
        }

        .card-label {
            font-family: 'Cinzel', serif;
            font-size: 0.7rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 500;
            color: rgba(232, 217, 184, 0.5);
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8);
            transition: color 0.3s ease, transform 0.3s ease;
        }

        .card-link:hover .card-label {
            color: rgba(232, 217, 184, 0.75);
        }

        .card-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(4, 18, 23, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 6px 16px 6px 14px;
            border-radius: 60px;
            border: 1px solid rgba(169, 132, 69, 0.1);
            font-size: 0.65rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 500;
            color: rgba(232, 217, 184, 0.7);
            pointer-events: auto;
            transition: background 0.3s ease, border-color 0.3s ease, transform 0.25s ease;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        }

        .card-link:hover .card-badge {
            background: rgba(169, 132, 69, 0.12);
            border-color: rgba(169, 132, 69, 0.2);
            transform: scale(1.04);
        }

        .card-badge .icon {
            display: inline-block;
            font-size: 0.9rem;
            line-height: 1;
        }

        /* coming soon badge */
        .badge-soon {
            background: rgba(0, 0, 0, 0.6);
            border-color: rgba(255, 255, 255, 0.04);
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 3px;
        }

        .card-link:hover .badge-soon {
            background: rgba(255, 255, 255, 0.03);
            border-color: rgba(255, 255, 255, 0.06);
            transform: scale(1.02);
            color: rgba(255, 255, 255, 0.5);
        }

        .badge-soon .icon {
            opacity: 0.5;
        }

        /* play icon (small) */
        .play-icon {
            display: inline-block;
            font-size: 1rem;
            line-height: 1;
            margin-right: 2px;
        }

        /* ----- card 1 disabled state (no link) ----- */
        .card-disabled {
            cursor: default;
        }

        .card-disabled:hover {
            transform: scale(1.02);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 30px rgba(255, 255, 255, 0.01);
            border-color: rgba(255, 255, 255, 0.04);
        }

        .card-disabled:active {
            transform: scale(0.98);
        }

        /* ----- animation keyframes ----- */
        @keyframes fadeDown {
            0% {
                opacity: 0;
                transform: translateY(-18px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(28px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* stagger children */
        .card-grid-2 .card-link:nth-child(1) {
            animation-delay: 0.2s;
        }
        .card-grid-2 .card-link:nth-child(2) {
            animation-delay: 0.28s;
        }
        .card-featured .card-link {
            animation-delay: 0.1s;
        }

        .card-link {
            opacity: 0;
            animation: fadeUp 0.7s cubic-bezier(0.23, 1, 0.32, 1) forwards;
        }

        /* reduced motion */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
            .card-link:hover {
                transform: none !important;
            }
            .card-link:hover .card-image-wrap img {
                transform: none !important;
            }
            .card-link:hover .card-overlay {
                background: linear-gradient(180deg,
                        rgba(0, 0, 0, 0.05) 0%,
                        rgba(0, 0, 0, 0.25) 40%,
                        rgba(0, 0, 0, 0.7) 75%,
                        rgba(0, 0, 0, 0.9) 100%);
            }
            .home-link:hover {
                transform: none !important;
            }
        }

        /* ----- responsive ----- */
        @media (max-width: 992px) {
            .page-wrap {
                padding: 110px 24px 70px 24px;
            }
            .card-grid-2 {
                gap: 28px;
            }
        }

        @media (max-width: 768px) {
            .home-link {
                top: 20px;
                left: 20px;
                font-size: 0.6rem;
                padding: 8px 16px;
                letter-spacing: 2.5px;
            }
            .page-wrap {
                padding: 100px 18px 50px 18px;
            }
            .page-title {
                letter-spacing: 8px;
            }
            .page-divider {
                width: 55vw;
                margin: 16px auto 20px auto;
            }
            .cards-grid {
                gap: 28px;
            }
            .card-grid-2 {
                grid-template-columns: 1fr;
                gap: 28px;
            }
            .card-content {
                padding: 18px 20px 16px 20px;
            }
            .card-label {
                font-size: 0.6rem;
                letter-spacing: 2px;
            }
            .card-badge {
                font-size: 0.55rem;
                padding: 4px 12px 4px 10px;
                letter-spacing: 1.5px;
            }
            .card-link {
                border-radius: 16px;
            }
            .card-link::after {
                border-radius: 16px;
            }
        }

        @media (max-width: 480px) {
            .home-link {
                top: 16px;
                left: 16px;
                font-size: 0.55rem;
                padding: 7px 14px;
                letter-spacing: 2px;
                gap: 4px;
            }
            .page-wrap {
                padding: 90px 14px 40px 14px;
            }
            .page-title {
                letter-spacing: 5px;
                font-size: clamp(2.4rem, 12vw, 3.6rem);
            }
            .page-sub {
                font-size: 0.65rem;
                letter-spacing: 4px;
            }
            .page-divider {
                width: 50vw;
                margin: 12px auto 16px auto;
            }
            .cards-grid {
                gap: 22px;
            }
            .card-grid-2 {
                gap: 22px;
            }
            .card-content {
                padding: 14px 16px 14px 16px;
            }
            .card-label {
                font-size: 0.5rem;
                letter-spacing: 1.5px;
            }
            .card-badge {
                font-size: 0.5rem;
                padding: 3px 10px 3px 8px;
                letter-spacing: 1px;
                gap: 4px;
            }
            .card-link {
                border-radius: 14px;
            }
            .card-link::after {
                border-radius: 14px;
            }
        }

        /* ─── DE PAUL COLLEGE MYSORE · institutional branding (top-right) ─── */
        .depaul-brand {
            position: fixed;
            top: 28px;
            right: 32px;
            z-index: 30;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            pointer-events: none;
            animation: fadeDown 0.9s cubic-bezier(0.23, 1, 0.32, 1) both;
        }
        .depaul-brand img {
            width: clamp(30px, 3.4vw, 44px);
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 2px 14px rgba(0, 0, 0, 0.6));
        }
        .depaul-brand span {
            font-family: 'Cinzel', serif;
            font-size: clamp(0.6rem, 1vw, 0.85rem);
            font-weight: 700;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: rgba(232, 217, 184, 0.7);
            text-shadow: 0 2px 16px rgba(0, 0, 0, 0.8);
            white-space: nowrap;
        }
        @media (max-width: 768px) {
            .depaul-brand { top: 20px; right: 20px; gap: 8px; }
        }
        @media (max-width: 480px) {
            .depaul-brand { top: 16px; right: 16px; gap: 6px; }
            .depaul-brand img { width: 24px; }
            .depaul-brand span { font-size: 0.55rem; letter-spacing: 0.12em; }
        }

        /* touch: prevent sticky hover on mobile */
        @media (hover: hover) {
            .card-link:hover {
                transform: scale(1.025);
            }
            .card-disabled:hover {
                transform: scale(1.02);
            }
        }

        @media (hover: none) {
            .card-link:hover {
                transform: none !important;
            }
            .card-link:hover .card-image-wrap img {
                transform: none !important;
            }
            .card-link:hover .card-overlay {
                background: linear-gradient(180deg,
                        rgba(0, 0, 0, 0.05) 0%,
                        rgba(0, 0, 0, 0.25) 40%,
                        rgba(0, 0, 0, 0.7) 75%,
                        rgba(0, 0, 0, 0.9) 100%);
            }
            .card-link:active {
                transform: scale(0.97) !important;
            }
            .home-link:hover {
                transform: none !important;
            }
        }
    </style>
</head>
<body>
    <!-- background orbs -->
    <div class="page-bg-orb orb-a"></div>
    <div class="page-bg-orb orb-b"></div>
    <div class="page-bg-orb orb-c"></div>

    <!-- home link -->
    <a href="index.html" class="home-link" aria-label="Back to home">
        <span class="arrow">←</span> Home
    </a>

    <!-- De Paul College Mysore branding (institutional, top-right) -->
    <div class="depaul-brand">
        <img src="assets/img/depaul-logo.png" alt="De Paul College Mysore logo" loading="lazy" />
        <span>DE PAUL COLLEGE MYSORE</span>
    </div>

    <main class="page-wrap">
        <!-- header -->
        <div class="header-section">
            <h1 class="page-title">Legacy</h1>
            <div class="page-sub">Moments that become memories</div>
            <hr class="page-divider" />
        </div>

        <!-- cards -->
        <div class="cards-grid">
            <!-- CARD 1 – featured / coming soon -->
            <div class="card-featured">
                <div class="card-link card-disabled" role="button" aria-label="Coming soon – no link" tabindex="0">
                    <div class="card-image-wrap">
                        <img src="assets/img/legacy-1.jpg" alt="Legacy card 1 – coming soon" loading="lazy" />
                        <div class="card-overlay"></div>
                    </div>
                    <div class="card-content">
                        <span class="card-label">Featured</span>
                        <span class="card-badge badge-soon">
                            <span class="icon">✦</span> Coming soon
                        </span>
                    </div>
                </div>
            </div>

            <!-- CARD 2–5 in 2-column grid -->
            <div class="card-grid-2">
                <!-- CARD 2 -->
                <a href="https://youtu.be/XEXfyTwYfG4?si=pqRHuBmYVnmlCGiX" target="_blank" rel="noopener noreferrer" class="card-link" aria-label="Watch video 2">
                    <div class="card-image-wrap">
                        <img src="assets/img/legacy-2.jpg" alt="Legacy card 2" loading="lazy" />
                        <div class="card-overlay"></div>
                    </div>
                    <div class="card-content">
                        <span class="card-label">Watch</span>
                        <span class="card-badge">
                            <span class="icon play-icon">▶</span> Play
                        </span>
                    </div>
                </a>

                <!-- CARD 3 -->
                <a href="https://youtu.be/Qrfcss-Q9RQ?si=HXZboBJdsxkdjV4n" target="_blank" rel="noopener noreferrer" class="card-link" aria-label="Watch video 3">
                    <div class="card-image-wrap">
                        <img src="assets/img/legacy-3.jpg" alt="Legacy card 3" loading="lazy" />
                        <div class="card-overlay"></div>
                    </div>
                    <div class="card-content">
                        <span class="card-label">Watch</span>
                        <span class="card-badge">
                            <span class="icon play-icon">▶</span> Play
                        </span>
                    </div>
                </a>

                <!-- CARD 4 -->
                <a href="https://youtu.be/Qrfcss-Q9RQ?si=HXZboBJdsxkdjV4n" target="_blank" rel="noopener noreferrer" class="card-link" aria-label="Watch video 4">
                    <div class="card-image-wrap">
                        <img src="assets/img/legacy-4.jpg" alt="Legacy card 4" loading="lazy" />
                        <div class="card-overlay"></div>
                    </div>
                    <div class="card-content">
                        <span class="card-label">Watch</span>
                        <span class="card-badge">
                            <span class="icon play-icon">▶</span> Play
                        </span>
                    </div>
                </a>

                <!-- CARD 5 -->
                <a href="https://youtu.be/xdGhgirpvCw?si=BuUeOIrBzCVqXsRj" target="_blank" rel="noopener noreferrer" class="card-link" aria-label="Watch video 5">
                    <div class="card-image-wrap">
                        <img src="assets/img/legacy-5.jpg" alt="Legacy card 5" loading="lazy" />
                        <div class="card-overlay"></div>
                    </div>
                    <div class="card-content">
                        <span class="card-label">Watch</span>
                        <span class="card-badge">
                            <span class="icon play-icon">▶</span> Play
                        </span>
                    </div>
                </a>
            </div>
        </div>

        <!-- subtle footer (not required but keeps DEPLOMAT identity) -->
        <div style="margin-top: 56px; font-size: 0.6rem; letter-spacing: 4px; text-transform: uppercase; color: rgba(169,132,69,0.15);">
            DEPLOMAT · Fest 2026
        </div>
    </main>

    <!-- tiny script for keyboard accessibility on card 1 (coming soon) -->
    <script>
        (function() {
            const disabledCard = document.querySelector('.card-disabled');
            if (disabledCard) {
                // prevent default on click (already no href, but for safety)
                disabledCard.addEventListener('click', function(e) {
                    e.preventDefault();
                    // subtle haptic-like feedback (just a tiny style flash)
                    this.style.transition = 'transform 0.1s ease';
                    this.style.transform = 'scale(0.97)';
                    setTimeout(() => {
                        this.style.transform = '';
                    }, 120);
                });

                // keyboard: Enter or Space -> same as click
                disabledCard.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        this.click();
                    }
                });

                // ensure it's focusable
                disabledCard.setAttribute('tabindex', '0');
                disabledCard.setAttribute('role', 'button');
            }

            // for all other cards, they are <a> so they work natively
            // but we ensure they open in new tab (target="_blank" already set)
        })();
    </script>
</body>
</html>
