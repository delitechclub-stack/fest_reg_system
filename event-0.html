<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>THE ATLANTEAN TRIALS · DEPLOMAT</title>
    <style>
        :root { color-scheme: dark; --background: #080b12; --panel: rgba(17, 24, 38, 0.82); --panel-border: rgba(255, 255, 255, 0.12); --text: #f5f7fb; --muted: #9ba8bc; --accent: #65d8ff; --accent-soft: rgba(101, 216, 255, 0.14); }
        * { box-sizing: border-box; }
        html, body { min-height: 100%; }
        body { margin: 0; display: grid; place-items: center; padding: 24px; overflow-x: hidden; background: radial-gradient(circle at 15% 20%, rgba(0, 173, 239, 0.16), transparent 32%), radial-gradient(circle at 85% 80%, rgba(255, 89, 139, 0.12), transparent 30%), linear-gradient(135deg, #080b12 0%, #0d1422 48%, #090b12 100%); color: var(--text); font-family: "Segoe UI", "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased; }
        body::before { position: fixed; inset: 0; z-index: -1; background-image: linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px); background-size: 46px 46px; content: ""; mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.8), transparent 85%); }
        .detail-shell { width: min(100%, 720px); animation: reveal 0.65s ease both; }
        .detail-panel { position: relative; overflow: hidden; padding: clamp(32px, 7vw, 72px); border: 1px solid var(--panel-border); border-radius: 24px; background: var(--panel); box-shadow: 0 30px 90px rgba(0, 0, 0, 0.42), inset 0 1px 0 rgba(255, 255, 255, 0.06); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
        .detail-panel::after { position: absolute; top: 0; left: 0; width: 100%; height: 3px; background: linear-gradient(90deg, transparent, var(--accent), transparent); content: ""; opacity: 0.9; }
        .eyebrow { margin: 0 0 24px; color: var(--accent); font-size: 0.72rem; font-weight: 700; letter-spacing: 0.28em; text-transform: uppercase; }
        h1 { max-width: 620px; margin: 0; font-family: Impact, "Arial Black", sans-serif; font-size: clamp(2.5rem, 8vw, 5.8rem); font-weight: 900; letter-spacing: 0.04em; line-height: 0.98; text-wrap: balance; }
        .subtitle { margin: 22px 0 0; color: var(--accent); font-size: clamp(0.85rem, 2vw, 1rem); letter-spacing: 0.2em; text-transform: uppercase; }
        .description { max-width: 540px; margin: 42px 0 48px; padding-left: 18px; border-left: 2px solid var(--accent); color: var(--muted); font-size: 1.05rem; line-height: 1.7; }
        .back-link { display: inline-flex; min-height: 48px; align-items: center; justify-content: center; padding: 12px 20px; border: 1px solid rgba(101, 216, 255, 0.42); border-radius: 999px; background: var(--accent-soft); color: var(--text); font-size: 0.9rem; font-weight: 700; letter-spacing: 0.04em; text-decoration: none; transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease; }
        .back-link:hover, .back-link:focus-visible { border-color: var(--accent); background: rgba(101, 216, 255, 0.24); outline: none; transform: translateY(-2px); }
        .back-link:active { transform: translateY(0); }
        @keyframes reveal { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 540px) { body { padding: 16px; } .detail-panel { border-radius: 18px; } .description { margin-top: 32px; margin-bottom: 36px; font-size: 0.98rem; } .back-link { width: 100%; } }
        @media (prefers-reduced-motion: reduce) { .detail-shell { animation: none; } .back-link { transition: none; } }
    </style>
</head>
<body>
    <main class="detail-shell">
        <section class="detail-panel">
            <p class="eyebrow">DEPLOMAT · Event Details</p>
            <h1>THE ATLANTEAN TRIALS</h1>
            <p class="subtitle">.escape room</p>
            <p class="description">Full details for THE ATLANTEAN TRIALS will be updated soon.</p>
            <a class="back-link" href="index.html">← Back to Home</a>
        </section>
    </main>
</body>
</html>
