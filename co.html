            transition: all 0.2s ease;
        }

        .glass-card:hover {

            box-shadow: 0 40px 80px -20px #000000cc, 0 0 0 1px rgba(100, 210, 255, 0.05) inset;
        }

        .header-section {

            padding: 0.4rem 0;

        }

        .back-link:hover {

        }

            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 0.5rem 0 0.2rem 0;
        }

    // ============================================================

    function formatPhone(phone) {
        if (!phone) return '';
        const cleaned = phone.replace(/\D/g, '');
        if (cleaned.length === 10) {
            return `+91 ${cleaned.slice(0, 5)} ${cleaned.slice(5)}`;
        }
        return phone;
    }

    function getRawPhone(phone) {
        return phone.replace(/\D/g, '');
    }

    function getRoleInfo(roleType, index, total) {
        const roles = {
            'main': { class: 'main', label: 'Main Coordinator', priority: 'Priority 1' },
            'sub': { class: 'sub', label: 'Sub Coordinator', priority: 'Priority 2' },
            'third': { class: 'third', label: 'Third Coordinator', priority: 'Priority 3' },
            'faculty': { class: 'faculty', label: 'Faculty Coordinator', priority: 'Priority 4' }
        };

        let role = roles[roleType] || roles['faculty'];
        let label = role.label;

        if (roleType === 'faculty' && total > 1) {
            label = `Faculty ${index + 1}`;
        }

        return {
            className: role.class,
            label: label,
            priority: role.priority
        };
    }

    // ============================================================
    // 🔥 FIXED: FIND EVENT BY NAME OR ID
    // ============================================================

    function findEvent(searchTerm) {
        if (!searchTerm) return null;

        const trimmed = searchTerm.trim();

        // 1. Try exact match on event_name
        let event = coordinatorData.event_coordinators.find(e =>
            e.event_name.toLowerCase() === trimmed.toLowerCase()
        );
        if (event) return event;

        // 2. Try matching by event_id (if searchTerm is a number)
        if (!isNaN(trimmed)) {
            const id = parseInt(trimmed);
            event = coordinatorData.event_coordinators.find(e => e.event_id === id);
            if (event) return event;
        }

        // 3. Try mapping from eventNameMap
        const mappedName = eventNameMap[trimmed.toUpperCase()];
        if (mappedName) {
            event = coordinatorData.event_coordinators.find(e =>
                e.event_name.toLowerCase() === mappedName.toLowerCase()
            );
            if (event) return event;
        }

        // 4. Try partial match (contains)
        const upperTrimmed = trimmed.toUpperCase();
        event = coordinatorData.event_coordinators.find(e =>
            e.event_name.toUpperCase().includes(upperTrimmed) ||
            (e.event_display && e.event_display.toUpperCase().includes(upperTrimmed))
        );
        if (event) return event;

        // 5. Try matching by display name
        event = coordinatorData.event_coordinators.find(e =>
            e.event_display && e.event_display.toLowerCase() === trimmed.toLowerCase()
        );
        if (event) return event;

        return null;
    }

    // ============================================================

    function renderCoordinators(searchTerm) {
        const container = document.getElementById('coordinatorContent');

        if (!searchTerm) {
            container.innerHTML = `
                <div class="error-state">
                    <div class="big-icon">🔍</div>
                    <h3>No Event Selected</h3>
                    <p>Please specify an event name to view coordinators.</p>
                    <p style="margin-top: 0.5rem; font-size: 0.85rem;">
                        <a href="index.html" style="color: #64d8ff; text-decoration: none;">← Back to Home</a>
                    </p>
                </div>
            `;
            return;
        }

        const event = findEvent(searchTerm);

        if (!event) {
            // Show debug info to help troubleshoot
            const allNames = coordinatorData.event_coordinators.map(e =>
                `"${e.event_name}"${e.event_display ? ` (${e.event_display})` : ''}`
            ).join(', ');

            container.innerHTML = `
                <div class="error-state">
                    <div class="big-icon">❓</div>
                    <h3>Event Not Found</h3>
                    <p>We couldn't find coordinators for "<strong>${searchTerm}</strong>".</p>
                    <p style="margin-top: 0.5rem; font-size: 0.85rem;">Available events: <br /><span style="color: #90dfff; font-size: 0.8rem;">${allNames}</span></p>
                    <div class="debug-info">

                        You passed: <code>${searchTerm}</code><br />
                        Try using the exact event name from the list above.

                        <a href="javascript:history.back()" style="color: #64d8ff; text-decoration: none;">← Go Back</a>
                    </p>
                </div>
            `;
            return;
        }

        // Build coordinator list in priority order
        let coordinators = [];

        if (event.main_student_coordinator) {
            coordinators.push({
                type: 'main',
                name: event.main_student_coordinator.name,
                phone: event.main_student_coordinator.phone,
                index: 0,

        if (event.sub_event_coordinator) {
            coordinators.push({
                type: 'sub',
                name: event.sub_event_coordinator.name,
                phone: event.sub_event_coordinator.phone,
                index: 0,
                total: 1
            });
        } else if (event.sub_event_coordinators && event.sub_event_coordinators.length > 0) {
            event.sub_event_coordinators.forEach((sub, idx) => {
                coordinators.push({
                    type: 'sub',
                    name: sub.name,
                    phone: sub.phone,
                    index: idx,
                    total: event.sub_event_coordinators.length
                });
            });
        }

        if (event.third_student_coordinator) {
            coordinators.push({
                type: 'third',
                name: event.third_student_coordinator.name,
                phone: event.third_student_coordinator.phone,
                index: 0,
                total: 1
            });
        }

        if (event.faculty_event_coordinators && event.faculty_event_coordinators.length > 0) {
            event.faculty_event_coordinators.forEach((faculty, idx) => {
                coordinators.push({
                    type: 'faculty',
                    name: faculty.name,
                    phone: faculty.phone,
                    index: idx,
                    total: event.faculty_event_coordinators.length
                });
            });
        }

        let html = `
            <div>
                <h2 class="event-title">${event.event_name}</h2>
                ${event.event_display ? `<div style="color: #7a9bc7; font-size: 0.9rem;">${event.event_display}</div>` : ''}
                <div style="margin-top: 0.3rem; color: #7a9bc7; font-size: 0.9rem;">
                    ${coordinators.length} coordinator${coordinators.length > 1 ? 's' : ''} available
                </div>
            </div>

            <div class="divider"></div>

            <div style="margin-bottom: 0.5rem; font-size: 0.85rem; color: #7a9bc7;">
                <span style="color: #90dfff;">📞</span> Calling Priority:
                <span style="color: #b6ccf0;">Main</span>
                <span style="color: #7a9bc7;">→</span>
                <span style="color: #b6ccf0;">Sub</span>
                <span style="color: #7a9bc7;">→</span>
                <span style="color: #b6ccf0;">Third</span>
                <span style="color: #7a9bc7;">→</span>
                <span style="color: #b6ccf0;">Faculty</span>
            </div>

            <div class="coordinator-list">
        `;

        coordinators.forEach((coord, idx) => {
            const roleInfo = getRoleInfo(coord.type, coord.index, coord.total);
            const rawPhone = getRawPhone(coord.phone);
            const displayPhone = formatPhone(coord.phone);

            html += `
                <div class="coordinator-item" style="${idx === 0 ? 'border-color: rgba(100, 210, 255, 0.2);' : ''}">
                    <div class="coordinator-info">
                        <div class="coordinator-name">
                            ${coord.name}
                            <span class="coordinator-role ${roleInfo.className}">
                                ${roleInfo.label}
                            </span>
                            ${idx === 0 ? '<span class="priority-badge">★ Primary</span>' : ''}
                        </div>
                        <div class="coordinator-phone">
                            📱 ${displayPhone}
                            <span style="color: #5a7a9a; font-size: 0.75rem; margin-left: 0.5rem;">
                                ${roleInfo.priority}
                            </span>
                        </div>
                    </div>
                    <a href="tel:${rawPhone}" class="call-btn">
                        <span class="icon">📞</span>
                        Call
                    </a>
                </div>
            `;
        });

        html += `
            </div>

            <div class="call-priority-info">
                <strong>📌 Calling Priority:</strong>
                <span class="step">1</span> Main Student Coordinator
                <span style="color: #5a7a9a; margin: 0 0.3rem;">→</span>
                <span class="step">2</span> Sub-Event Coordinator
                <span style="color: #5a7a9a; margin: 0 0.3rem;">→</span>
                <span class="step">3</span> Third Coordinator
                <span style="color: #5a7a9a; margin: 0 0.3rem;">→</span>
                <span class="step">4</span> Faculty Coordinator
                <br />
                <span style="color: #5a7a9a; font-size: 0.8rem; display: inline-block; margin-top: 0.3rem;">
                    ⚡ If one doesn't answer, try the next in priority order.
                </span>
            </div>

            <div style="margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid rgba(255,255,255,0.03);">
                <a href="javascript:history.back()" style="color: #7a9bc7; text-decoration: none; font-size: 0.9rem;">
                    ← Back to event page
                </a>
            </div>
        `;

        container.innerHTML = html;
    }

    // ============================================================
    // GET EVENT NAME FROM URL
    // ============================================================

    function getEventNameFromURL() {
        const params = new URLSearchParams(window.location.search);
        let eventName = params.get('event') || params.get('name');

        if (!eventName) {
            const referrer = document.referrer;
            if (referrer) {
                try {
                    const url = new URL(referrer);
                    const pathParts = url.pathname.split('/');
                    const page = pathParts[pathParts.length - 1];
                    if (page && page.startsWith('event-')) {
                        // Try to get event name from referrer page
                        // We'll check if the referrer URL has an event parameter
                        const refParams = new URLSearchParams(url.search);
                        const refEvent = refParams.get('event');
                        if (refEvent) return refEvent;
                    }
                } catch (e) {}
            }
        }

        return eventName;
    }

    // ============================================================
    // INITIALIZE
    // ============================================================

    const eventName = getEventNameFromURL();

    if (eventName) {
        renderCoordinators(eventName);
    } else {
        const storedEvent = sessionStorage.getItem('selectedEvent');
        if (storedEvent) {
            renderCoordinators(storedEvent);
        } else {
            document.getElementById('coordinatorContent').innerHTML = `
                <div class="error-state">
                    <div class="big-icon">👋</div>
                    <h3>Select an Event</h3>
                    <p>Go to an event page and click "Connect Coordinator" to see the contact details.</p>
                    <p style="margin-top: 0.5rem; font-size: 0.85rem;">
                        <a href="index.html" style="color: #64d8ff; text-decoration: none;">← Back to Home</a>
                    </p>
                </div>
            `;
        }
    }

    // Log available events for debugging
    console.log('📋 Available events:', coordinatorData.event_coordinators.map(e => e.event_name).join(', '));
</script>
