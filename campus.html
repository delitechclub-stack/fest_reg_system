<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>DEPLOMAT · Explore Campus</title>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; overscroll-behavior: none; }
        body {
            font-family: 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: #0a0a0f;
            color: #fff;
            overflow-x: hidden;
            min-height: 100dvh;
            -webkit-font-smoothing: antialiased;
        }

        .page-bg-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.18;
            z-index: 0;
            pointer-events: none;
        }
        .orb-a { width: 520px; height: 520px; background: #00d4ff; top: -10%; left: 30%; }
        .orb-b { width: 460px; height: 460px; background: #ff2a6d; bottom: -10%; left: -10%; }

        .home-link {
            position: fixed;
            top: 28px;
            left: 32px;
            z-index: 20;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            font-size: 0.75rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 500;
            padding: 10px 18px;
            border-radius: 60px;
            background: rgba(16, 16, 26, 0.5);
            backdrop-filter: blur(20px) saturate(1.2);
            -webkit-backdrop-filter: blur(20px) saturate(1.2);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
            transition: 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            -webkit-tap-highlight-color: transparent;
        }
        .home-link:hover {
            color: #00d4ff;
            border-color: rgba(0, 212, 255, 0.2);
            transform: translateX(-4px);
            background: rgba(0, 212, 255, 0.06);
        }
        .home-link:active { transform: scale(0.95); }

        .page-wrap {
            position: relative;
            z-index: 2;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 120px 24px 80px 24px;
            text-align: center;
        }

        .page-title {
            font-family: 'Impact', 'Arial Black', sans-serif;
            font-size: clamp(2.2rem, 8vw, 5.5rem);
            font-weight: 900;
            letter-spacing: 8px;
            text-transform: uppercase;
            line-height: 1.1;
            background: linear-gradient(135deg, #00d4ff 0%, #b000ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 80px rgba(0, 212, 255, 0.08);
        }

        .page-divider {
            width: min(220px, 60vw);
            height: 1px;
            margin: 28px auto 32px auto;
            background: linear-gradient(90deg, transparent, rgba(0, 212, 255, 0.5), rgba(176, 0, 255, 0.5), transparent);
            border: none;
            opacity: 0.7;
        }

        .glass-card {
            max-width: 640px;
            width: 100%;
            background: rgba(16, 16, 26, 0.55);
            backdrop-filter: blur(32px) saturate(1.2);
            -webkit-backdrop-filter: blur(32px) saturate(1.2);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.6);
            padding: 34px 30px;
            text-align: left;
        }

        .page-text {
            font-size: 1rem;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.7);
            font-weight: 300;
        }

        .page-tag {
            font-size: 0.65rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.25);
            margin-top: 24px;
            text-align: center;
        }

        @media (max-width: 768px) {
            .home-link { top: 20px; left: 20px; font-size: 0.7rem; padding: 9px 15px; letter-spacing: 2.5px; }
            .page-wrap { padding: 100px 18px 60px 18px; }
            .page-title { letter-spacing: 5px; }
            .glass-card { padding: 26px 22px; border-radius: 20px; }
            .page-text { font-size: 0.95rem; }
            .page-divider { width: 55vw; margin: 22px auto 26px auto; }
        }
        @media (max-width: 480px) {
            .home-link { top: 16px; left: 16px; font-size: 0.65rem; padding: 8px 13px; letter-spacing: 2px; }
            .page-title { letter-spacing: 3px; }
            .glass-card { padding: 22px 18px; border-radius: 18px; }
            .page-text { font-size: 0.9rem; line-height: 1.55; }
            .page-divider { width: 50vw; margin: 18px auto 22px auto; }
        }
    </style>
</head>
<body>
    <div class="page-bg-orb orb-a"></div>
    <div class="page-bg-orb orb-b"></div>
    <a href="index.html" class="home-link" aria-label="Back to home">← Home</a>
    <main class="page-wrap">
        <h1 class="page-title">Explore Campus</h1>
        <hr class="page-divider" />
        <div class="glass-card">
            <p class="page-text">This is the placeholder text for the Explore Campus page. Replace this with your actual content later. Wander through the spaces where DEPLOMAT comes to life — every corner holds a stage, every pathway leads to a new experience.</p>
        </div>
        <div class="page-tag">DEPLOMAT · Fest 2026</div>
    </main>
</body>
</html>
